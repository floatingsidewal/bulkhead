name: Publish to npmjs.org

on:
  workflow_dispatch:
    branches: [main]

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    name: Build & Publish to npmjs.org
    runs-on: ubuntu-latest
    environment: default
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
        # OIDC token is automatically used when no NODE_AUTH_TOKEN is provided

      - run: npm install -g npm@latest
      - run: npm ci

      - name: Build core
        run: cd packages/core && npx tsup
      - name: Build server
        run: cd packages/server && npx tsup

      - name: Publish @bulkhead-ai/core
        run: |
          cd packages/core
          set +e
          npm publish --provenance --access public 2>&1 | tee pub.log; code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then grep -qiE 'cannot publish over|previously published|EPUBLISHCONFLICT|409' pub.log && echo "::notice::version already published, skipping" || exit "$code"; fi

      - name: Publish @bulkhead-ai/server
        run: |
          cd packages/server
          set +e
          npm publish --provenance --access public 2>&1 | tee pub.log; code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then grep -qiE 'cannot publish over|previously published|EPUBLISHCONFLICT|409' pub.log && echo "::notice::version already published, skipping" || exit "$code"; fi
