name: Release Please

on:
  push:
    branches: [main, next]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    environment: default
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      - run: npm ci

      - name: Build core
        run: cd packages/core && npx tsup

      - name: Build server
        run: cd packages/server && npx tsup

      - name: Determine npm dist-tag
        id: dist-tag
        run: echo "tag=${{ github.ref_name == 'main' && 'latest' || 'next' }}" >> "$GITHUB_OUTPUT"

      - name: Publish @bulkhead-ai/core to npmjs
        run: |
          cd packages/core
          set +e
          npm publish --provenance --access public --tag ${{ steps.dist-tag.outputs.tag }} 2>&1 | tee pub.log; code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then grep -qiE 'cannot publish over|previously published|EPUBLISHCONFLICT|409' pub.log && echo "::notice::version already published, skipping" || exit "$code"; fi

      - name: Publish @bulkhead-ai/server to npmjs
        run: |
          cd packages/server
          set +e
          npm publish --provenance --access public --tag ${{ steps.dist-tag.outputs.tag }} 2>&1 | tee pub.log; code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then grep -qiE 'cannot publish over|previously published|EPUBLISHCONFLICT|409' pub.log && echo "::notice::version already published, skipping" || exit "$code"; fi

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/prepare-github-package-manifests.mjs
          npm config set //npm.pkg.github.com/:_authToken=$NODE_AUTH_TOKEN
          npm config set @floatingsidewal:registry=https://npm.pkg.github.com/
          for package in packages/core packages/server; do
            set +e
            npm publish "./$package" --no-git-checks --tag ${{ steps.dist-tag.outputs.tag }} 2>&1 | tee pub.log; code=${PIPESTATUS[0]}
            set -e
            if [ "$code" -ne 0 ]; then grep -qiE 'cannot publish over|previously published|EPUBLISHCONFLICT|409' pub.log && echo "::notice::$package already published, skipping" || exit "$code"; fi
          done
